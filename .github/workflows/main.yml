name: update
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 5/12 * * *'
  watch:
    types: [started]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nsgamespider-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install requirements
        run: python -m pip install wget beautifulsoup4 urllib3
      - name: Working
        run: python main.py
      - name: Record time
        run: date -u > date.log
      - name: Commit files
        run: |
          git config --local user.email "dr_hamilton@foxmail.com"
          git config --local user.name "Ravello-H"
          git add -A
          if git diff --cached --quiet; then
            echo "No files changed."
          else
            git commit -m "$(date -u '+%Y-%m-%d %H:%M:%S')"
            git push origin HEAD:main
          fi
